<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/estilos.css">

    <title>Café | Contacto</title>
</head>

<body>

    <header>

        <h1>Café</h1>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
            </ul>
        </nav>

    </header>


    <main>

        <section>

            <h2>Contacto</h2>

            <p>
                ¿Tienes alguna duda sobre nuestros productos?
                Escríbenos y te ayudaremos.
            </p>

        </section>


        <section>

            <h2>Envíanos un mensaje</h2>

            <form id="form-contacto">

                <div>
                    <label for="txtNombre">
                        Nombre:
                    </label>

                    <input
                        type="text"
                        id="txtNombre"
                        name="nombre"
                        maxlength="100"
                        placeholder="Ingresa tu nombre"
                        autocomplete="name"
                    >

                    <small id="error-nombre"></small>
                </div>


                <br>


                <div>
                    <label for="txtEmail">
                        Correo electrónico:
                    </label>

                    <input
                        type="email"
                        id="txtEmail"
                        name="email"
                        maxlength="100"
                        placeholder="ejemplo@gmail.com"
                        autocomplete="email"
                    >

                    <small id="error-email"></small>
                </div>


                <br>


                <div>
                    <label for="txtComentario">
                        Comentario:
                    </label>

                    <textarea
                        id="txtComentario"
                        name="comentario"
                        maxlength="500"
                        rows="6"
                        placeholder="Escribe tu consulta"
                    ></textarea>

                    <small id="error-comentario"></small>
                </div>


                <br>


                <button type="submit">
                    Enviar mensaje
                </button>

            </form>


            <div id="mensaje-contacto"></div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 Café. Todos los derechos reservados.</p>

    </footer>


    <script src="js/contacto.js"></script>

</body>

</html>
